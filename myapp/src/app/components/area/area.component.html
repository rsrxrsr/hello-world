
<app-form #f entityName="area/ctrl" name="Area" (editChange)="setEdit($event)" 
  [catalogos]="['area', 'usuario', 'Enum/area/nivel']"
>
  <div formTpl>

    <form id="idForm" #entityForm="ngForm" >
      <div class="row">					
        <label for="id">Id</label>
        <input type="number"
          id="id"  name="id" #inId="ngModel"  
          [(ngModel)]="entity.id" [readonly]="noEdit" 
          placeholder="..."
          required />
        <div *ngIf="inId.invalid && inId.touched">
          <small class="invalid">Campo Id obligatorio</small>
        </div>
      </div>
      <div class="row">
        <label for="area">Area</label>
        <input type="text"
          id="area" name="area"  #inArea="ngModel"
          [(ngModel)]="entity.area" [readonly]="noEdit" 
          placeholder="Teclee datos..."
          required min="2" />
          <div *ngIf="inArea.invalid && entityForm.controls['area']?.touched">
            <small class="invalid">Campo obligatorio</small>
          </div>
      </div>
      <div class="row">
        <label for="nivel">Nivel</label>
        <select
          id="nivel"  name="nivel" #inNivel="ngModel"
          [(ngModel)]="entity.nivel"
          [disabled]="noEdit ? true : false" required >
          <option value="" disabled selected>-- Seleccione una opción --</option>
          <option *ngFor="let opcion of entityService.db['area/nivel']" [ngValue]="opcion">{{ opcion }}</option>
        </select>
      </div>
      <div class="row">
        <label for="orden">Orden</label>
        <input type="number"
          id="orden" name="orden"  #inNivel="ngModel"
          [(ngModel)]="entity.orden" [readonly]="noEdit" 
          placeholder="Teclee datos..."
          required min="1" />
          <div *ngIf="inNivel.invalid && entityForm.controls['orden']?.touched">
            <small class="invalid">Campo obligatorio</small>
          </div>
      </div>
      <div class="row">
        <label for="puesto">Puesto</label>
        <input type="text"
          id="puesto" name="puesto"  #inPuesto="ngModel"
          [(ngModel)]="entity.puesto" [readonly]="noEdit" 
          placeholder="Teclee datos..."
          required min="2" />
          <div *ngIf="inPuesto.invalid && entityForm.controls['puesto']?.touched">
            <small class="invalid">Campo obligatorio</small>
          </div>
      </div>
      <div class="row">
        <label for="jefe">Jefe</label>
        <select id="jefe" name="jefe" #inJefe="ngModel"
          [(ngModel)]="entity.jefe" [compareWith]="compareFn" 
          [disabled]="noEdit ? true : false" required>
          <option value="" disabled selected>-- Seleccione una opción --</option>
          <option *ngFor="let opcion of entityService.db['usuario']" [ngValue]="opcion">{{ opcion['usuario'] }}</option>
        </select>
        <div *ngIf="inJefe.invalid && entityForm.controls['jefe']?.touched">
          <small class="invalid">Campo obligatorio</small>
        </div>
      </div>
      <div class="row">
        <label for="jefatura">Jefatura</label>
        <select id="jefatura" name="jefatura" #inJefatura="ngModel"
          [(ngModel)]="entity.jefatura" [compareWith]="compareFn" 
           [disabled]="noEdit ? true : false" required>
          <option value="" disabled selected>-- Seleccione una opción --</option>
          <option *ngFor="let opcion of entityService.db['area']" [ngValue]="opcion">{{ opcion['area'] }}</option>
        </select>
        <div *ngIf="inJefatura.invalid && entityForm.controls['jefatura']?.touched">
          <small class="invalid">Campo obligatorio</small>
        </div>
      </div>

      <div class="row">
        <label for="estatus">Estatus</label>
        <select
          id="estatus"  name="estatus" #inEstatus="ngModel"
          [(ngModel)]="entity.estatus" [disabled]="noEdit ? true : false" 
          required >
          <option value="" disabled selected>-- Seleccione una opción --</option>
            <option  value="ACTIVO">ACTIVO</option>
            <option  value="SUSPENDIDO">SUSPENDIDO</option>
            <option  value="BAJA">BAJA</option>
        </select>
      </div>

    </form>      

  </div>    
</app-form>
