<app-form entityName="usuario/ctrl" (editChange)="setEdit($event)" 
    name="Usuarios" 
    [catalogos]="['area']">

<div formTpl>

<form id="idForm" #entityForm="ngForm">					
  <div class="row">
    <label for="usuario">Usuario</label>
    <input type="text"
      id="usuario" name="usuario"  #inUsuario="ngModel"
      [(ngModel)]="entity.usuario" [readonly]="noEdit" 
      placeholder="Teclee datos..."
      required min="2" />
      <div *ngIf="inUsuario.invalid && entityForm.controls['usuario']?.touched">
        <small class="invalid">Campo obligatorio</small>
      </div>
  </div>
  <div class="row">
    <label for="password">Password</label>
    <input type="text"
      id="password" name="password"  #inPassword="ngModel"
      [(ngModel)]="entity.password" [readonly]="noEdit" 
      placeholder="Teclee datos..."
      required min="2" />
      <div *ngIf="inPassword.invalid && entityForm.controls['password']?.touched">
        <small class="invalid">Campo obligatorio</small>
      </div>
  </div>
<!---->
  <div class="row">
    <label for="area">Area</label>
    <select id="area" name="area" #inArea="ngModel"
      [(ngModel)]="entity.area" [compareWith]="compareFn" 
      [disabled]="noEdit ? true : false" required>
      <option value="" disabled selected>-- Seleccione una opción --</option>
      <option *ngFor="let opcion of entityService.db['area']" [ngValue]="opcion">{{ opcion['area'] }}</option>
    </select>
    <div *ngIf="inArea.invalid && entityForm.controls['area']?.touched">
      <small class="invalid">Campo obligatorio</small>
    </div>
  </div>
<!----> 
  <div class="row">
    <label for="estatus">Estatus</label>
    <select
      id="estatus"  name="estatus" #inEstatus="ngModel"
      [(ngModel)]="entity.estatus"
      [disabled]="noEdit ? true : false" required >
      <option value="" disabled selected>-- Seleccione una opción --</option>
        <option  value="ACTIVO">ACTIVO</option>
        <option  value="SUSPENDIDO">SUSPENDIDO</option>
        <option  value="BAJA">BAJA</option>
    </select>
  </div>
</form>

</div>
</app-form>
